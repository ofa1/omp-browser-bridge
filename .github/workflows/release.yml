name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign-and-release:
    name: Sign Addon & Create GitHub Release
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Git tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./firefox/manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match firefox/manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Validate AMO credentials for tag release
        if: github.ref_type == 'tag' && (env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == '')
        run: |
          echo "::error::Tag release requires AMO_JWT_ISSUER and AMO_JWT_SECRET secrets for signing."
          exit 1

      - name: Run complete verification suite
        run: npm run check

      - name: Build WebExtension zip artifact
        run: npm run build:addon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Submit WebExtension to AMO for signing (listed channel)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx web-ext sign \
            --channel listed \
            --source-dir firefox \
            --artifacts-dir dist \
            --amo-metadata amo/metadata.json \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
